name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack
        run: |
          Z=$(ls *.zip 2>/dev/null | head -1)
          if [ -n "$Z" ]; then
            echo "Found archive: $Z"
            unzip -q -o "$Z" -d src
          fi
          S=$(find . -name settings.gradle -not -path "*/build/*" | head -1)
          if [ -z "$S" ]; then
            echo "ERROR: project not found. Upload Dhammapada.zip to the repository."
            exit 1
          fi
          echo "PROJ=$(dirname "$S")" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug --no-daemon
      - name: Rename
        run: cp ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk Dhammapada.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1-${{ github.run_number }}
          name: Dhammapada ${{ github.run_number }}
          files: Dhammapada.apk
